
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Groceries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Online Groceries</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Login</a>
            <a href="#">Admin</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Fresh Groceries at Your Doorstep</h2>
        <p>Buy fresh fruits, vegetables and daily essentials.</p>
    </section>

    <section class="products">
        <h2>Our Products</h2>

        <div class="product-container">

            <div class="product">
                <img src="https://images.unsplash.com/photo-1546094096-0df4bcaaa337?w=300"
                     alt="Tomatoes">
                <h3>Tomatoes</h3>
                <p>₹40 / kg</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=300"
                     alt="Bananas">
                <h3>Bananas</h3>
                <p>₹60 / dozen</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=300"
                     alt="Apples">
                <h3>Apples</h3>
                <p>₹120 / kg</p>
                <button>Add to Cart</button>
            </div>

        </div>
    </section>

    <footer>
        <p>Online Groceries | DevOps Project</p>
    </footer>

</body>
</html>
